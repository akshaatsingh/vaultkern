name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vaultkern
          POSTGRES_PASSWORD: vaultkern_secret
          POSTGRES_DB: vaultkern_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Run database migrations & Vitest suite
        env:
          PORT: "3001"
          HOST: "0.0.0.0"
          NODE_ENV: "test"
          DATABASE_URL: "postgresql://vaultkern:vaultkern_secret@localhost:5432/vaultkern_db"
          REDIS_URL: "redis://localhost:6379"
          ADMIN_API_KEY: "vaultkern_admin_secret_key_2026"
        run: |
          npm run migrate
          npm test
