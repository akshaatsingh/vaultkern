services:
  postgres:
    image: postgres:16-alpine
    container_name: vaultkern-postgres
    restart: always
    environment:
      POSTGRES_USER: vaultkern
      POSTGRES_PASSWORD: vaultkern_secret
      POSTGRES_DB: vaultkern_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultkern -d vaultkern_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vaultkern-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
